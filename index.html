<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ארכיון בלוק תשבי-ששון | מפת מחקר</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        direction: rtl;
        overflow: hidden;
        color: #e2e8f0;
        font-size: 13px;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* ── Side Panel ──────────────────────────────────────── */
      #side-panel {
        width: 34%;
        min-width: 340px;
        max-width: 480px;
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        border-left: 1px solid #2d2d4a;
      }
      #panel-header {
        padding: 14px 18px 10px;
        border-bottom: 1px solid #2d2d4a;
        background: #16162a;
      }
      .hdr-title {
        font-size: 16px;
        font-weight: 700;
        color: #f1f5f9;
      }
      .hdr-sub {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 2px;
      }
      .stats-bar {
        display: flex;
        gap: 10px;
        margin-top: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .stats-bar span {
        background: #2d2d4a;
        padding: 2px 8px;
        border-radius: 4px;
      }
      .stats-bar .n {
        color: #60a5fa;
        font-weight: 600;
      }

      /* Tabs */
      #tabs {
        display: flex;
        background: #16162a;
        border-bottom: 1px solid #2d2d4a;
      }
      .tab {
        flex: 1;
        padding: 10px 6px;
        text-align: center;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 500;
        color: #64748b;
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
      }
      .tab.active {
        color: #60a5fa;
        border-bottom-color: #60a5fa;
      }
      .tab:hover {
        color: #94a3b8;
      }

      /* Tab content */
      .tab-content {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
      }
      .tab-content.active {
        display: block;
      }
      .tab-content::-webkit-scrollbar {
        width: 6px;
      }
      .tab-content::-webkit-scrollbar-track {
        background: transparent;
      }
      .tab-content::-webkit-scrollbar-thumb {
        background: #2d2d4a;
        border-radius: 3px;
      }

      /* ── Search tab ──────────────────────────────────────── */
      .search-box {
        position: relative;
        margin-bottom: 10px;
      }
      .search-box input {
        width: 100%;
        padding: 8px 12px;
        background: #2d2d4a;
        border: 1px solid #3d3d5c;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 13px;
        outline: none;
        direction: rtl;
      }
      .search-box input::placeholder {
        color: #64748b;
      }
      .search-box input:focus {
        border-color: #60a5fa;
      }

      /* Filters */
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-label {
        font-size: 11px;
        color: #94a3b8;
        min-width: 40px;
      }
      .parcel-btn {
        padding: 4px 10px;
        background: #2d2d4a;
        border: 1px solid #3d3d5c;
        border-radius: 4px;
        color: #94a3b8;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.15s;
      }
      .parcel-btn.active {
        background: #3b82f6;
        border-color: #3b82f6;
        color: white;
      }
      .filter-select {
        padding: 4px 8px;
        background: #2d2d4a;
        border: 1px solid #3d3d5c;
        border-radius: 4px;
        color: #94a3b8;
        font-size: 11px;
        direction: rtl;
        outline: none;
      }

      /* Time slider */
      .time-slider-wrap {
        margin-bottom: 12px;
      }
      .time-slider-wrap label {
        font-size: 11px;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
      }
      .time-slider-wrap input[type="range"] {
        width: 100%;
        margin-top: 4px;
        accent-color: #3b82f6;
      }
      .dual-range {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dual-range input[type="range"] {
        flex: 1;
      }
      .range-val {
        font-size: 11px;
        color: #60a5fa;
        min-width: 32px;
        text-align: center;
      }

      /* Result count */
      .result-count {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #2d2d4a;
      }

      /* Folder card */
      .folder-card {
        background: #222244;
        border: 1px solid #2d2d4a;
        border-radius: 8px;
        margin-bottom: 8px;
        overflow: hidden;
        transition: border-color 0.15s;
      }
      .folder-card:hover {
        border-color: #3b82f6;
      }
      .folder-card-header {
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .folder-title {
        font-weight: 600;
        font-size: 13px;
        color: #f1f5f9;
      }
      .folder-meta {
        display: flex;
        gap: 8px;
        font-size: 11px;
        color: #94a3b8;
        flex-wrap: wrap;
      }
      .folder-meta .addr {
        color: #60a5fa;
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 500;
      }
      .badge-permit {
        background: #1e3a5f;
        color: #60a5fa;
      }
      .badge-danger {
        background: #5f1e1e;
        color: #f87171;
      }
      .badge-ownership {
        background: #1e5f3a;
        color: #4ade80;
      }
      .badge-default {
        background: #3d3d5c;
        color: #94a3b8;
      }

      /* Document list inside folder */
      .folder-docs {
        display: none;
        border-top: 1px solid #2d2d4a;
        max-height: 300px;
        overflow-y: auto;
      }
      .folder-card.expanded .folder-docs {
        display: block;
      }
      .doc-item {
        padding: 6px 12px;
        border-bottom: 1px solid #1a1a2e;
        font-size: 11px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .doc-item:last-child {
        border-bottom: none;
      }
      .doc-date {
        color: #64748b;
        min-width: 65px;
        flex-shrink: 0;
      }
      .doc-type-badge {
        min-width: 36px;
        text-align: center;
        flex-shrink: 0;
      }
      .doc-liner {
        color: #cbd5e1;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .doc-liner a {
        color: #cbd5e1;
        text-decoration: none;
      }
      .doc-liner a:hover {
        color: #60a5fa;
        text-decoration: underline;
      }

      /* ── Timeline tab ────────────────────────────────────── */
      .timeline {
        position: relative;
        padding-right: 20px;
      }
      .timeline::before {
        content: "";
        position: absolute;
        right: 8px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #2d2d4a;
      }
      .tl-item {
        position: relative;
        margin-bottom: 12px;
        padding-right: 20px;
      }
      .tl-dot {
        position: absolute;
        right: -16px;
        top: 6px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #2d2d4a;
      }
      .tl-dot.permit {
        background: #3b82f6;
      }
      .tl-dot.danger {
        background: #ef4444;
      }
      .tl-dot.ownership {
        background: #22c55e;
      }
      .tl-dot.mixed {
        background: #6b7280;
      }
      .tl-year {
        font-size: 10px;
        color: #64748b;
        margin-bottom: 2px;
      }

      /* ── Stats tab ───────────────────────────────────────── */
      .stats-section {
        margin-bottom: 24px;
      }
      .stats-section h3 {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #2d2d4a;
      }

      /* Insight cards */
      .insight-card {
        background: #222244;
        border: 1px solid #2d2d4a;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 8px;
        font-size: 12px;
        line-height: 1.6;
        color: #e2e8f0;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .insight-emoji {
        font-size: 16px;
        flex-shrink: 0;
      }

      /* Bar chart */
      .bar-chart {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
      }
      .bar-label {
        min-width: 36px;
        text-align: left;
        color: #94a3b8;
      }
      .bar-track {
        flex: 1;
        height: 16px;
        background: #2d2d4a;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }
      .bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s;
        min-width: 1px;
      }
      .bar-fill.blue {
        background: #3b82f6;
      }
      .bar-fill.red {
        background: #ef4444;
      }
      .bar-fill.green {
        background: #22c55e;
      }
      .bar-fill.orange {
        background: #f97316;
      }
      .bar-fill.yellow {
        background: #eab308;
      }
      .bar-fill.purple {
        background: #a855f7;
      }
      .bar-value {
        min-width: 28px;
        text-align: right;
        color: #94a3b8;
        font-size: 10px;
      }

      /* Dual bar */
      .dual-bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .dual-bar-label {
        min-width: 40px;
        text-align: left;
        color: #94a3b8;
      }
      .dual-bar-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dual-bar-track {
        height: 10px;
        background: #2d2d4a;
        border-radius: 2px;
        overflow: hidden;
        display: flex;
      }
      .dual-bar-vals {
        min-width: 60px;
        font-size: 9px;
        color: #64748b;
        display: flex;
        gap: 6px;
      }

      /* Heatmap */
      .heatmap-grid {
        display: grid;
        gap: 2px;
        font-size: 10px;
      }
      .heatmap-cell {
        padding: 4px;
        text-align: center;
        border-radius: 3px;
        color: #e2e8f0;
        font-weight: 500;
      }
      .heatmap-header {
        color: #94a3b8;
        font-weight: 600;
        font-size: 9px;
      }

      /* Data table */
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      .data-table th {
        text-align: right;
        padding: 6px 8px;
        color: #94a3b8;
        border-bottom: 1px solid #2d2d4a;
        font-weight: 600;
        font-size: 10px;
      }
      .data-table td {
        padding: 5px 8px;
        border-bottom: 1px solid #1a1a2e;
        color: #cbd5e1;
      }
      .data-table tr:hover td {
        background: #222244;
      }

      /* ── Map ─────────────────────────────────────────────── */
      #map {
        flex: 1;
        z-index: 1;
      }

      /* Leaflet tooltip override */
      .building-tooltip {
        background: #1a1a2e !important;
        color: #e2e8f0 !important;
        border: 1px solid #3b82f6 !important;
        border-radius: 4px !important;
        padding: 4px 8px !important;
        font-size: 11px !important;
        font-family: "Segoe UI", sans-serif !important;
        direction: rtl !important;
        white-space: nowrap !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
      }
      .building-tooltip::before {
        border-top-color: #3b82f6 !important;
      }

      /* Anomaly popup */
      .anomaly-popup {
        direction: rtl;
        font-family: "Segoe UI", sans-serif;
        font-size: 12px;
        max-width: 280px;
        color: #1e293b;
      }
      .anomaly-popup h4 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .anomaly-popup .score-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
        font-size: 13px;
        color: white;
        margin-bottom: 6px;
      }
      .anomaly-popup ul {
        margin: 4px 0;
        padding-right: 16px;
        font-size: 11px;
        line-height: 1.6;
      }
      .anomaly-popup .people-list {
        font-size: 10px;
        color: #64748b;
        margin-top: 4px;
      }

      /* Legend */
      .map-legend {
        background: rgba(26, 26, 46, 0.92);
        padding: 10px 14px;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 11px;
        direction: rtl;
        line-height: 1.8;
        border: 1px solid #2d2d4a;
        max-width: 200px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .legend-divider {
        border-top: 1px solid #2d2d4a;
        margin: 4px 0;
      }

      /* ── Anomaly tab ─────────────────────────────────────── */
      .anomaly-rank-card {
        background: #222244;
        border: 1px solid #2d2d4a;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .anomaly-rank-card:hover {
        border-color: #f97316;
      }
      .anomaly-rank-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .anomaly-rank-num {
        font-size: 18px;
        font-weight: 800;
        color: #f97316;
        min-width: 24px;
      }
      .anomaly-rank-addr {
        font-size: 13px;
        font-weight: 600;
        color: #f1f5f9;
        flex: 1;
      }
      .anomaly-rank-score {
        font-size: 12px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        color: white;
      }
      .anomaly-rank-desc {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.5;
        margin-top: 2px;
      }
      .anomaly-rank-flags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .anomaly-flag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 3px;
        background: #3d3d5c;
        color: #cbd5e1;
      }

      /* Anomaly filter buttons */
      .anomaly-filter-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .anomaly-filter-btn {
        padding: 4px 10px;
        background: #2d2d4a;
        border: 1px solid #3d3d5c;
        border-radius: 4px;
        color: #94a3b8;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.15s;
      }
      .anomaly-filter-btn.active {
        background: #f97316;
        border-color: #f97316;
        color: white;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 11px;
        color: #94a3b8;
      }
      .toggle-switch {
        position: relative;
        width: 36px;
        height: 20px;
        background: #2d2d4a;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .toggle-switch.on {
        background: #f97316;
      }
      .toggle-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .toggle-switch.on::after {
        transform: translateX(-16px);
      }

      /* ── Mobile ──────────────────────────────────────────── */
      @media (max-width: 768px) {
        #app {
          flex-direction: column-reverse;
        }
        #side-panel {
          width: 100%;
          min-width: unset;
          max-width: unset;
          height: 45vh;
        }
        #map {
          height: 55vh;
        }
      }

      /* ── Misc ────────────────────────────────────────────── */
      .note {
        font-size: 10px;
        color: #64748b;
        font-style: italic;
        margin-top: 4px;
      }

      /* ── Danger warning on folder card ────────────────────── */
      .folder-danger-warning {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        margin: 0 12px 4px;
        background: #5f1e1e;
        border: 1px solid #ef4444;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #fca5a5;
      }

      /* ── Building filter banner ─────────────────────────── */
      .building-filter-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: #1e3a5f;
        border: 1px solid #3b82f6;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .building-filter-info {
        font-size: 12px;
        font-weight: 600;
        color: #93c5fd;
        line-height: 1.5;
      }
      .building-filter-clear {
        padding: 4px 12px;
        background: #3b82f6;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 11px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .building-filter-clear:hover {
        background: #2563eb;
      }
      .building-empty {
        text-align: center;
        padding: 30px 16px;
        color: #64748b;
        font-size: 13px;
      }

      /* Overlay layer control */
      .overlay-control {
        background: rgba(26, 26, 46, 0.92);
        padding: 10px 14px;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 11px;
        direction: rtl;
        border: 1px solid #2d2d4a;
      }
      .overlay-control label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        margin-bottom: 4px;
      }
      .overlay-control input[type="checkbox"] {
        accent-color: #f97316;
      }

      /* Canvas chart container */
      .chart-canvas-wrap {
        background: #222244;
        border: 1px solid #2d2d4a;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .chart-canvas-wrap canvas {
        width: 100% !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side-panel">
        <div id="panel-header">
          <div class="hdr-title">ארכיון בלוק תשבי-ששון</div>
          <a
            href="dashboard.html"
            style="
              display: inline-block;
              margin: 4px 0;
              padding: 4px 12px;
              background: #fbbf24;
              color: #1a1a2e;
              border-radius: 4px;
              text-decoration: none;
              font-size: 12px;
              font-weight: 600;
            "
            >&#x1F4CA; דף נתונים מאוחד</a
          >
          <div class="hdr-sub" id="header-sub"></div>
          <div class="stats-bar" id="stats-bar"></div>
        </div>
        <div id="tabs">
          <div class="tab active" data-tab="search">חיפוש</div>
          <div class="tab" data-tab="timeline">ציר זמן</div>
          <div class="tab" data-tab="anomalies">אנומליות</div>
          <div class="tab" data-tab="stats">סטטיסטיקה</div>
        </div>
        <div id="tab-search" class="tab-content active"></div>
        <div id="tab-timeline" class="tab-content"></div>
        <div id="tab-anomalies" class="tab-content"></div>
        <div id="tab-stats" class="tab-content"></div>
      </div>
      <div id="map"></div>
    </div>

    <script>
      /* ══════════════════════════════════════════════════════
         DATA + STATE
         ══════════════════════════════════════════════════════ */
      let DATA = null;
      let ANOMALY_RANKING = null;
      let ANOMALY_SYNTHESIS = null;
      let GIS_CROSSREF = null;
      let PEOPLE_NETWORK = null;

      let map, parcelLayer, buildingLayer;
      let dangerousLayer = null,
        zoningGapLayer = null;
      let activeParcelFilter = null;
      let activeTypeFilter = "";
      let searchText = "";
      let yearMin = 1950,
        yearMax = 2026;
      let selectedBuildingLayer = null;
      let activeBuildingFilter = null;
      let anomalyMode = true; // heat coloring on by default
      let anomalyCategoryFilter = "";
      let anomalyOnlyFlag = false; // toggle: show only score > 40

      // Anomaly score → address lookup (built after data loads)
      let anomalyByAddress = {};
      let anomalyByBuilding = {};
      let findingsByAddress = {};

      const TYPE_COLORS = {
        permit: "#3b82f6",
        danger: "#ef4444",
        ownership: "#22c55e",
        mixed: "#6b7280",
        none: "#374151",
      };

      const TYPE_LABELS = {
        permit: "היתרים/בנייה",
        danger: "סכנה/הריסה",
        ownership: "בעלות/טאבו",
        mixed: "מעורב",
        none: "ללא מסמכים",
      };

      const ANOMALY_CATEGORIES = {
        physical_anomaly: "פיזי",
        documentary_anomaly: "תיעודי",
        network_anomaly: "רשת",
        zoning_gap: "ייעוד",
        compound_anomaly: "מורכב",
        dangerous_vs_archive: "סכנה",
        demolition_without_danger: "הריסה",
        conservation_gap: "שימור",
        planning_pattern: "תכנון",
      };

      const ANOMALY_FILTER_MAP = {
        physical: ["physical_anomaly"],
        documentary: ["documentary_anomaly"],
        network: ["network_anomaly"],
        zoning: ["zoning_gap"],
        economic: ["compound_anomaly", "demolition_without_danger"],
      };

      function getAnomalyColor(score) {
        if (score >= 80) return "#991b1b"; // dark red
        if (score >= 60) return "#dc2626"; // red
        if (score >= 40) return "#f97316"; // orange
        if (score >= 20) return "#eab308"; // yellow
        return "#6b7280"; // gray
      }

      function getBadgeClass(type) {
        if (["היתר", "בקשה", "תוכנית"].includes(type)) return "badge-permit";
        if (["צו", "הודעה"].includes(type)) return "badge-danger";
        if (["נסח", "שומה"].includes(type)) return "badge-ownership";
        return "badge-default";
      }

      function getCategoryForType(dominant) {
        if (["היתר", "בקשה", "תוכנית"].includes(dominant)) return "permit";
        if (["צו", "הודעה"].includes(dominant)) return "danger";
        if (["נסח", "שומה"].includes(dominant)) return "ownership";
        return "mixed";
      }

      /* ══════════════════════════════════════════════════════
         INIT
         ══════════════════════════════════════════════════════ */
      async function init() {
        const [respData, respAnomaly, respSynthesis, respGis, respPeople] =
          await Promise.all([
            fetch("./data/map-data.json"),
            fetch("./data/anomaly-ranking.json"),
            fetch("./data/anomaly-synthesis.json"),
            fetch("./data/gis-crossref.json"),
            fetch("./data/people-network.json"),
          ]);

        DATA = await respData.json();
        ANOMALY_RANKING = await respAnomaly.json();
        ANOMALY_SYNTHESIS = await respSynthesis.json();
        GIS_CROSSREF = await respGis.json();
        PEOPLE_NETWORK = await respPeople.json();

        // Build anomaly lookup by address
        (ANOMALY_RANKING.all_ranked || []).forEach((a) => {
          anomalyByAddress[a.address] = a;
        });

        // Build findings lookup by address
        (ANOMALY_SYNTHESIS.findings || []).forEach((f) => {
          if (!findingsByAddress[f.address]) findingsByAddress[f.address] = [];
          findingsByAddress[f.address].push(f);
        });

        // Match anomalies to buildings by address
        DATA.buildings.forEach((b) => {
          if (b.address && anomalyByAddress[b.address]) {
            anomalyByBuilding[b.id] = anomalyByAddress[b.address];
          }
        });

        document.getElementById("header-sub").textContent =
          `גוש 6135 | ${DATA.meta.total_documents.toLocaleString()} מסמכים | ${DATA.meta.total_folders} תיקים`;

        const parcelsWithDocs = DATA.parcels.filter(
          (p) => p.doc_count > 0,
        ).length;
        document.getElementById("stats-bar").innerHTML = `
          <span>חלקות: <span class="n">${parcelsWithDocs}</span></span>
          <span>בניינים: <span class="n">${DATA.buildings.length}</span></span>
          <span>תיקים: <span class="n">${DATA.meta.total_folders}</span></span>
        `;

        initMap();
        initTabs();
        buildSearchTab();
        buildTimelineTab();
        buildAnomalyTab();
        buildStatsTab();
      }

      /* ══════════════════════════════════════════════════════
         MAP
         ══════════════════════════════════════════════════════ */
      function initMap() {
        map = L.map("map", {
          center: [32.0495, 34.7925],
          zoom: 17,
          zoomControl: false,
        });

        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
          {
            attribution: "CartoDB",
            maxZoom: 20,
          },
        ).addTo(map);

        L.control.zoom({ position: "topright" }).addTo(map);

        // Parcel layer
        const maxDocCount = Math.max(
          ...DATA.parcels.map((p) => p.doc_count),
          1,
        );
        parcelLayer = L.geoJSON(
          {
            type: "FeatureCollection",
            features: DATA.parcels.map((p) => ({
              type: "Feature",
              geometry: p.geometry,
              properties: p,
            })),
          },
          {
            style: (feature) => {
              const ratio = feature.properties.doc_count / maxDocCount;
              return {
                color: "#64748b",
                weight: 1.5,
                fillColor: "#94a3b8",
                fillOpacity: 0.05 + ratio * 0.2,
                dashArray: "4 4",
              };
            },
            onEachFeature: (feature, layer) => {
              const p = feature.properties;
              layer.bindTooltip(`חלקה ${p.chelka} | ${p.doc_count} מסמכים`, {
                sticky: true,
                direction: "top",
                offset: [0, -10],
                className: "building-tooltip",
              });
            },
          },
        ).addTo(map);

        // Building layer
        buildingLayer = L.geoJSON(
          {
            type: "FeatureCollection",
            features: DATA.buildings.map((b) => ({
              type: "Feature",
              geometry: b.geometry,
              properties: b,
            })),
          },
          {
            style: (feature) => getBuildingStyle(feature.properties),
            onEachFeature: (feature, layer) => {
              const b = feature.properties;
              const parts = [];
              if (b.address) parts.push(b.address);
              if (b.floors) parts.push(`${b.floors} קומות`);
              if (b.year) parts.push(String(b.year));
              const anom = anomalyByBuilding[b.id];
              if (anom) parts.push(`ציון: ${anom.composite_score}`);
              if (parts.length > 0) {
                layer.bindTooltip(parts.join(" | "), {
                  sticky: true,
                  direction: "top",
                  offset: [0, -10],
                  className: "building-tooltip",
                });
              }
              layer.on("click", () => {
                if (anomalyByBuilding[b.id]) {
                  showAnomalyPopup(b, layer);
                }
                const hasFolders =
                  b.matched_folders && b.matched_folders.length > 0;
                if (hasFolders) {
                  showBuildingFolders(b);
                } else if (b.doc_count > 0) {
                  showParcelFolders(b.parcel);
                } else {
                  showBuildingFolders(b);
                }
              });
            },
          },
        ).addTo(map);

        // Add overlay layers
        addDangerousLayer();
        addZoningGapLayer();

        // Legend
        addLegend();

        // Overlay control
        addOverlayControl();
      }

      function getBuildingStyle(b) {
        const anom = anomalyByBuilding[b.id];
        if (anomalyMode && anom) {
          const score = anom.composite_score;
          const color = getAnomalyColor(score);
          return {
            color: color,
            weight: 2,
            fillColor: color,
            fillOpacity: 0.25 + (score / 100) * 0.45,
          };
        }
        const hasData = b.doc_count > 0;
        return {
          color: hasData ? "#3b82f6" : "#4b5563",
          weight: hasData ? 1.5 : 0.5,
          fillColor: hasData ? "#3b82f6" : "#374151",
          fillOpacity: hasData ? 0.15 + Math.min(b.doc_count / 200, 0.4) : 0.04,
        };
      }

      function refreshBuildingStyles() {
        if (!buildingLayer) return;
        buildingLayer.eachLayer((layer) => {
          const b = layer.feature.properties;
          layer.setStyle(getBuildingStyle(b));
        });
      }

      function showAnomalyPopup(b, layer) {
        const anom = anomalyByBuilding[b.id];
        if (!anom) return;
        const findings = findingsByAddress[b.address] || [];
        const color = getAnomalyColor(anom.composite_score);

        // Group findings by category
        const byCategory = {};
        findings.forEach((f) => {
          const cat = ANOMALY_CATEGORIES[f.category] || f.category;
          if (!byCategory[cat]) byCategory[cat] = [];
          byCategory[cat].push(f);
        });

        // Key people for this address
        const addrPeople = PEOPLE_NETWORK.addresses
          ? PEOPLE_NETWORK.addresses.find((a) => a.address === b.address)
          : null;
        const topPeople = addrPeople
          ? addrPeople.people.slice(0, 5).join(", ")
          : "";

        let html = `<div class="anomaly-popup">`;
        html += `<h4>${b.address || "בניין " + b.id}</h4>`;
        html += `<div class="score-badge" style="background:${color}">ציון: ${anom.composite_score}</div>`;

        if (Object.keys(byCategory).length > 0) {
          html += `<ul>`;
          for (const [cat, items] of Object.entries(byCategory)) {
            html += `<li><strong>${cat}</strong> (${items.length}): ${items[0].description.substring(0, 80)}${items[0].description.length > 80 ? "..." : ""}</li>`;
          }
          html += `</ul>`;
        }

        if (anom.flags && anom.flags.length > 0) {
          html += `<div style="margin-top:4px;font-size:10px;color:#f97316">${anom.flags.join(" | ")}</div>`;
        }

        if (topPeople) {
          html += `<div class="people-list">שחקנים: ${topPeople}</div>`;
        }
        html += `</div>`;

        layer.bindPopup(html, { maxWidth: 300 }).openPopup();
      }

      function addDangerousLayer() {
        if (!GIS_CROSSREF.dangerous_vs_buildings) return;
        const features = GIS_CROSSREF.dangerous_vs_buildings
          .map((d) => {
            // Find nearest building geometry
            const building = DATA.buildings.find(
              (b) => b.id === d.nearest_building_id,
            );
            if (!building || !building.geometry) return null;
            return {
              type: "Feature",
              geometry: building.geometry,
              properties: d,
            };
          })
          .filter(Boolean);

        dangerousLayer = L.geoJSON(
          { type: "FeatureCollection", features },
          {
            style: {
              color: "#ef4444",
              weight: 3,
              dashArray: "8 4",
              fillColor: "transparent",
              fillOpacity: 0,
            },
            onEachFeature: (feature, layer) => {
              const d = feature.properties;
              layer.bindTooltip(
                `מבנה מסוכן (591): ${d.address}<br>${d.order_type}`,
                {
                  sticky: true,
                  direction: "top",
                  className: "building-tooltip",
                },
              );
            },
          },
        );
        // Added to map by default
        dangerousLayer.addTo(map);
      }

      function addZoningGapLayer() {
        if (!GIS_CROSSREF.zoning_per_parcel) return;
        // Find parcels with mixed zoning (potential gaps)
        const mixedParcels = GIS_CROSSREF.zoning_per_parcel.filter(
          (z) => z.zoning && z.zoning.length > 1,
        );

        const features = mixedParcels
          .map((z) => {
            const parcel = DATA.parcels.find(
              (p) => p.chelka === z.chelka || p.chelka === String(z.chelka),
            );
            if (!parcel || !parcel.geometry) return null;
            return {
              type: "Feature",
              geometry: parcel.geometry,
              properties: {
                chelka: z.chelka,
                zonings: z.zoning.map((x) => x.yeud_name).join(", "),
              },
            };
          })
          .filter(Boolean);

        if (features.length === 0) return;

        zoningGapLayer = L.geoJSON(
          { type: "FeatureCollection", features },
          {
            style: {
              color: "#a855f7",
              weight: 2,
              fillColor: "#a855f7",
              fillOpacity: 0.1,
              dashArray: "4 4 1 4",
            },
            onEachFeature: (feature, layer) => {
              const p = feature.properties;
              layer.bindTooltip(
                `חלקה ${p.chelka}: ייעוד מעורב — ${p.zonings}`,
                {
                  sticky: true,
                  direction: "top",
                  className: "building-tooltip",
                },
              );
            },
          },
        );
        zoningGapLayer.addTo(map);
      }

      function addLegend() {
        const legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
          const div = L.DomUtil.create("div", "map-legend");
          div.innerHTML = `
            <div style="font-weight:600;margin-bottom:4px;">ציון אנומליה</div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:#991b1b"></div>
              80-100 קריטי
            </div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:#dc2626"></div>
              60-80 גבוה
            </div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:#f97316"></div>
              40-60 בינוני
            </div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:#eab308"></div>
              20-40 נמוך
            </div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:#6b7280"></div>
              0-20 תקין
            </div>
            <div class="legend-divider"></div>
            <div style="font-weight:600;margin-bottom:4px;">שכבות</div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:transparent;border:2px dashed #ef4444"></div>
              מבנה מסוכן (591)
            </div>
            <div class="legend-item">
              <div class="legend-swatch" style="background:rgba(168,85,247,0.15);border:1px dashed #a855f7"></div>
              ייעוד מעורב
            </div>
          `;
          return div;
        };
        legend.addTo(map);
      }

      function addOverlayControl() {
        const ctrl = L.control({ position: "topright" });
        ctrl.onAdd = function () {
          const div = L.DomUtil.create("div", "overlay-control");
          div.innerHTML = `
            <div style="font-weight:600;margin-bottom:6px;">שכבות</div>
            <label><input type="checkbox" id="chk-anomaly" checked> צביעת אנומליות</label>
            <label><input type="checkbox" id="chk-dangerous" checked> מבנים מסוכנים</label>
            <label><input type="checkbox" id="chk-zoning" checked> ייעוד מעורב</label>
          `;
          L.DomEvent.disableClickPropagation(div);
          return div;
        };
        ctrl.addTo(map);

        // Wait for DOM then attach listeners
        setTimeout(() => {
          document
            .getElementById("chk-anomaly")
            ?.addEventListener("change", (e) => {
              anomalyMode = e.target.checked;
              refreshBuildingStyles();
            });
          document
            .getElementById("chk-dangerous")
            ?.addEventListener("change", (e) => {
              if (e.target.checked && dangerousLayer) dangerousLayer.addTo(map);
              else if (dangerousLayer) map.removeLayer(dangerousLayer);
            });
          document
            .getElementById("chk-zoning")
            ?.addEventListener("change", (e) => {
              if (e.target.checked && zoningGapLayer) zoningGapLayer.addTo(map);
              else if (zoningGapLayer) map.removeLayer(zoningGapLayer);
            });
        }, 100);
      }

      function showParcelFolders(chelka) {
        switchTab("search");
        document
          .querySelectorAll(".parcel-btn")
          .forEach((btn) => btn.classList.remove("active"));
        const parcelStr = `6135_${chelka}`;
        const btn = document.querySelector(
          `.parcel-btn[data-parcel="${parcelStr}"]`,
        );
        if (btn) {
          btn.classList.add("active");
          activeParcelFilter = parcelStr;
        } else {
          activeParcelFilter = null;
        }
        applyFilters();
      }

      function showBuildingFolders(b) {
        switchTab("search");
        document
          .querySelectorAll(".parcel-btn")
          .forEach((btn) => btn.classList.remove("active"));
        activeParcelFilter = null;
        highlightBuilding(b);
        activeBuildingFilter = {
          building: b,
          folderIndices: b.matched_folders || [],
        };
        applyFilters();
      }

      function highlightBuilding(b) {
        clearBuildingHighlight();
        if (b.geometry) {
          selectedBuildingLayer = L.geoJSON(b.geometry, {
            style: {
              color: "#fbbf24",
              weight: 4,
              fillColor: "#fbbf24",
              fillOpacity: 0.3,
              dashArray: "",
            },
          }).addTo(map);
        }
      }

      function clearBuildingHighlight() {
        if (selectedBuildingLayer) {
          map.removeLayer(selectedBuildingLayer);
          selectedBuildingLayer = null;
        }
      }

      function clearBuildingFilter() {
        activeBuildingFilter = null;
        clearBuildingHighlight();
        applyFilters();
      }

      /* ══════════════════════════════════════════════════════
         TABS
         ══════════════════════════════════════════════════════ */
      function initTabs() {
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => switchTab(tab.dataset.tab));
        });
      }

      function switchTab(name) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
        document
          .querySelectorAll(".tab-content")
          .forEach((tc) =>
            tc.classList.toggle("active", tc.id === `tab-${name}`),
          );
      }

      /* ══════════════════════════════════════════════════════
         TAB 1: SEARCH
         ══════════════════════════════════════════════════════ */
      function buildSearchTab() {
        const container = document.getElementById("tab-search");

        const allTypes = new Set();
        DATA.folders.forEach((f) =>
          Object.keys(f.doc_types).forEach((t) => allTypes.add(t)),
        );
        const typeOptions = [...allTypes]
          .sort()
          .map((t) => `<option value="${t}">${t}</option>`)
          .join("");

        container.innerHTML = `
          <div class="search-box">
            <input type="text" id="search-input" placeholder="חיפוש חופשי — תיאור, אנשים, כתובות..." />
          </div>
          <div class="filter-row">
            <span class="filter-label">חלקה:</span>
            <button class="parcel-btn" data-parcel="6135_43">43</button>
            <button class="parcel-btn" data-parcel="6135_44">44</button>
            <button class="parcel-btn" data-parcel="6135_71">71</button>
            <button class="parcel-btn" data-parcel="6135_110">110</button>
          </div>
          <div class="filter-row">
            <span class="filter-label">סוג:</span>
            <select class="filter-select" id="type-filter">
              <option value="">הכל</option>
              ${typeOptions}
            </select>
          </div>
          <div class="time-slider-wrap">
            <label>
              <span>טווח שנים</span>
              <span id="year-display">1950 – 2026</span>
            </label>
            <div class="dual-range">
              <input type="range" id="year-min" min="1950" max="2026" value="1950" />
              <input type="range" id="year-max" min="1950" max="2026" value="2026" />
            </div>
          </div>
          <div class="result-count" id="result-count"></div>
          <div id="folder-results"></div>
        `;

        document
          .getElementById("search-input")
          .addEventListener("input", (e) => {
            searchText = e.target.value;
            activeBuildingFilter = null;
            clearBuildingHighlight();
            applyFilters();
          });

        document.querySelectorAll(".parcel-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeBuildingFilter = null;
            clearBuildingHighlight();
            if (btn.classList.contains("active")) {
              btn.classList.remove("active");
              activeParcelFilter = null;
            } else {
              document
                .querySelectorAll(".parcel-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              activeParcelFilter = btn.dataset.parcel;
            }
            applyFilters();
          });
        });

        document
          .getElementById("type-filter")
          .addEventListener("change", (e) => {
            activeTypeFilter = e.target.value;
            activeBuildingFilter = null;
            clearBuildingHighlight();
            applyFilters();
          });

        const yearMinEl = document.getElementById("year-min");
        const yearMaxEl = document.getElementById("year-max");
        const yearDisplay = document.getElementById("year-display");

        function updateYears() {
          yearMin = parseInt(yearMinEl.value);
          yearMax = parseInt(yearMaxEl.value);
          if (yearMin > yearMax) {
            yearMinEl.value = yearMax;
            yearMin = yearMax;
          }
          yearDisplay.textContent = `${yearMin} – ${yearMax}`;
          activeBuildingFilter = null;
          clearBuildingHighlight();
          applyFilters();
        }
        yearMinEl.addEventListener("input", updateYears);
        yearMaxEl.addEventListener("input", updateYears);

        applyFilters();
      }

      function applyFilters() {
        let results;

        if (activeBuildingFilter) {
          const matchedIndices = new Set(activeBuildingFilter.folderIndices);
          results = DATA.folders.filter((_, i) => matchedIndices.has(i));
        } else {
          results = DATA.folders.filter((f) => {
            if (activeParcelFilter && f.parcel !== activeParcelFilter)
              return false;
            if (activeTypeFilter && !f.doc_types[activeTypeFilter])
              return false;
            if (f.date_range) {
              const parts = f.date_range.split("–");
              if (parts.length === 2) {
                const fStart = parseInt(parts[0]);
                const fEnd = parseInt(parts[1]);
                if (fEnd < yearMin || fStart > yearMax) return false;
              }
            }
            if (searchText) {
              const q = searchText.toLowerCase();
              const haystack = [
                f.folder_title,
                f.primary_address,
                ...f.addresses,
                ...f.people.filter(Boolean),
                ...f.documents.map((d) => d.one_liner || ""),
              ]
                .join(" ")
                .toLowerCase();
              if (!haystack.includes(q)) return false;
            }
            return true;
          });
        }

        const container = document.getElementById("folder-results");
        let bannerHtml = "";

        if (activeBuildingFilter) {
          const b = activeBuildingFilter.building;
          const title = b.address || `בניין ${b.id}`;
          const totalDocs = results.reduce((s, f) => s + f.doc_count, 0);
          bannerHtml = `
            <div class="building-filter-banner">
              <div class="building-filter-info">
                בניין: ${title} | ${results.length} תיקים | ${totalDocs} מסמכים
              </div>
              <button class="building-filter-clear" onclick="clearBuildingFilter()">הצג הכל</button>
            </div>`;
          document.getElementById("result-count").textContent =
            `${results.length} תיקים לבניין זה`;
        } else {
          document.getElementById("result-count").textContent =
            `${results.length} תיקים מתוך ${DATA.folders.length}`;
        }

        if (activeBuildingFilter && results.length === 0) {
          container.innerHTML =
            bannerHtml +
            '<div class="building-empty">אין מסמכים לבניין זה</div>';
          return;
        }

        if (results.length === 0) {
          container.innerHTML =
            '<div style="color:#64748b;text-align:center;padding:20px;">לא נמצאו תוצאות</div>';
          return;
        }

        container.innerHTML =
          bannerHtml +
          results
            .sort((a, b) => b.doc_count - a.doc_count)
            .map((f) => renderFolderCard(f))
            .join("");

        container.querySelectorAll(".folder-card-header").forEach((hdr) => {
          hdr.addEventListener("click", () => {
            hdr.closest(".folder-card").classList.toggle("expanded");
          });
        });
      }

      function hasDangerIndicator(f) {
        const dangerKeywords = ["הריסה", "מסוכן", "סכנה"];
        const hasDangerTag = (f.tags || []).some((t) =>
          dangerKeywords.some((k) => t.includes(k)),
        );
        const hasDangerType = f.dominant_type === "צו";
        return hasDangerTag || hasDangerType;
      }

      function renderFolderCard(f) {
        const badgeCls = getBadgeClass(f.dominant_type);
        const isDanger = hasDangerIndicator(f);
        const docs = f.documents
          .map(
            (d) => `
          <div class="doc-item">
            <span class="doc-date">${d.date || "—"}</span>
            <span class="doc-type-badge"><span class="badge ${getBadgeClass(d.doc_type)}">${d.doc_type || "?"}</span></span>
            <span class="doc-liner"><a href="./docs/${d.file_name}" target="_blank" title="${(d.one_liner || "").replace(/"/g, "&quot;")}">${d.one_liner || d.file_name}</a></span>
          </div>`,
          )
          .join("");

        const dangerWarning = isDanger
          ? `<div class="folder-danger-warning">⚠ צו בניין מסוכן</div>`
          : "";

        return `
          <div class="folder-card">
            <div class="folder-card-header">
              <div class="folder-title">${f.folder_title || f.folder_id}</div>
              <div class="folder-meta">
                <span class="addr">${f.primary_address || "—"}</span>
                <span>${f.date_range || "—"}</span>
                <span>${f.doc_count}${f.doc_count % 50 === 0 && f.doc_count > 0 ? "+" : ""} מסמכים</span>
                <span class="badge ${badgeCls}">${f.dominant_type || "—"}</span>
              </div>
            </div>
            ${dangerWarning}
            <div class="folder-docs">${docs}</div>
          </div>`;
      }

      /* ══════════════════════════════════════════════════════
         TAB 2: TIMELINE
         ══════════════════════════════════════════════════════ */
      function buildTimelineTab() {
        const container = document.getElementById("tab-timeline");
        const sorted = [...DATA.folders]
          .filter((f) => f.date_range)
          .sort((a, b) => {
            const aYear = parseInt(a.date_range.split("–")[0]) || 9999;
            const bYear = parseInt(b.date_range.split("–")[0]) || 9999;
            return aYear - bYear;
          });

        container.innerHTML = `
          <div class="timeline">
            ${sorted
              .map((f) => {
                const cat = getCategoryForType(f.dominant_type);
                return `
                <div class="tl-item">
                  <div class="tl-dot ${cat}"></div>
                  <div class="tl-year">${f.date_range}</div>
                  ${renderFolderCard(f)}
                </div>`;
              })
              .join("")}
          </div>`;

        container.querySelectorAll(".folder-card-header").forEach((hdr) => {
          hdr.addEventListener("click", () => {
            hdr.closest(".folder-card").classList.toggle("expanded");
          });
        });
      }

      /* ══════════════════════════════════════════════════════
         TAB 3: ANOMALIES
         ══════════════════════════════════════════════════════ */
      function buildAnomalyTab() {
        const container = document.getElementById("tab-anomalies");

        const summary = ANOMALY_SYNTHESIS.summary || {};
        const totalFindings = summary.total_findings || 0;
        const byCat = summary.by_category || {};

        container.innerHTML = `
          <div style="margin-bottom:12px;">
            <div style="font-size:13px;font-weight:600;color:#f1f5f9;margin-bottom:4px;">
              ${totalFindings} ממצאי אנומליה | ${ANOMALY_RANKING.total_addresses || 0} כתובות
            </div>
            <div style="font-size:11px;color:#94a3b8;">
              סכנה: ${byCat.dangerous_vs_archive || 0} |
              פיזי: ${byCat.physical_anomaly || 0} |
              תיעודי: ${byCat.documentary_anomaly || 0} |
              רשת: ${byCat.network_anomaly || 0} |
              ייעוד: ${byCat.zoning_gap || 0} |
              מורכב: ${byCat.compound_anomaly || 0}
            </div>
          </div>

          <div class="anomaly-filter-row">
            <button class="anomaly-filter-btn active" data-acat="">הכל</button>
            <button class="anomaly-filter-btn" data-acat="physical">פיזי</button>
            <button class="anomaly-filter-btn" data-acat="documentary">תיעודי</button>
            <button class="anomaly-filter-btn" data-acat="network">רשת</button>
            <button class="anomaly-filter-btn" data-acat="zoning">ייעוד</button>
            <button class="anomaly-filter-btn" data-acat="economic">כלכלי</button>
          </div>

          <div class="toggle-row">
            <div class="toggle-switch" id="anomaly-only-toggle"></div>
            <span>הצג רק אנומליות (ציון > 40)</span>
          </div>

          <div class="result-count" id="anomaly-result-count"></div>
          <div id="anomaly-list"></div>
        `;

        // Filter buttons
        container.querySelectorAll(".anomaly-filter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            container
              .querySelectorAll(".anomaly-filter-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            anomalyCategoryFilter = btn.dataset.acat;
            renderAnomalyList();
          });
        });

        // Toggle
        document
          .getElementById("anomaly-only-toggle")
          .addEventListener("click", function () {
            anomalyOnlyFlag = !anomalyOnlyFlag;
            this.classList.toggle("on", anomalyOnlyFlag);
            renderAnomalyList();
          });

        renderAnomalyList();
      }

      function renderAnomalyList() {
        let items = ANOMALY_RANKING.all_ranked || [];

        // Filter by score threshold
        if (anomalyOnlyFlag) {
          items = items.filter((a) => a.composite_score > 40);
        }

        // Filter by category — check if address has findings of that type
        if (anomalyCategoryFilter) {
          const cats = ANOMALY_FILTER_MAP[anomalyCategoryFilter] || [];
          items = items.filter((a) => {
            const findings = findingsByAddress[a.address] || [];
            return findings.some((f) => cats.includes(f.category));
          });
        }

        // Sort by composite score desc
        items = items.sort((a, b) => b.composite_score - a.composite_score);

        const countEl = document.getElementById("anomaly-result-count");
        countEl.textContent = `${items.length} כתובות`;

        const listEl = document.getElementById("anomaly-list");

        // Show top items (all ranked or filtered)
        const display = items.slice(0, 50);

        listEl.innerHTML = display
          .map((a, i) => {
            const color = getAnomalyColor(a.composite_score);
            const findings = findingsByAddress[a.address] || [];
            // Get top finding description
            const topFinding = findings.length > 0 ? findings[0] : null;
            const desc = topFinding
              ? topFinding.description.substring(0, 100) +
                (topFinding.description.length > 100 ? "..." : "")
              : a.flags
                ? a.flags.join(", ")
                : "";

            // Category badges from findings
            const cats = [
              ...new Set(
                findings.map(
                  (f) => ANOMALY_CATEGORIES[f.category] || f.category,
                ),
              ),
            ].slice(0, 4);

            return `
            <div class="anomaly-rank-card" data-address="${a.address}" onclick="zoomToAddress('${a.address.replace(/'/g, "\\'")}')">
              <div class="anomaly-rank-header">
                <span class="anomaly-rank-num">${i + 1}</span>
                <span class="anomaly-rank-addr">${a.address}</span>
                <span class="anomaly-rank-score" style="background:${color}">${a.composite_score}</span>
              </div>
              <div class="anomaly-rank-desc">${desc}</div>
              <div class="anomaly-rank-flags">
                ${cats.map((c) => `<span class="anomaly-flag">${c}</span>`).join("")}
                ${a.danger_status > 0 ? '<span class="anomaly-flag" style="background:#5f1e1e;color:#fca5a5">מסוכן</span>' : ""}
              </div>
            </div>`;
          })
          .join("");
      }

      function zoomToAddress(address) {
        // Find building by address and zoom to it
        const building = DATA.buildings.find((b) => b.address === address);
        if (building && building.centroid) {
          map.setView([building.centroid[1], building.centroid[0]], 19);
          highlightBuilding(building);
        }
      }

      /* ══════════════════════════════════════════════════════
         TAB 4: STATS
         ══════════════════════════════════════════════════════ */
      function buildStatsTab() {
        const container = document.getElementById("tab-stats");
        const a = DATA.analytics;
        let html = "";

        // ── Key findings ──
        html += `<div class="stats-section"><h3>ממצאים מרכזיים</h3>`;
        a.key_findings.forEach((f) => {
          const emoji =
            f.includes("פער") || f.includes("בלתי חוקית")
              ? "⚠️"
              : f.includes("צווי") || f.includes("סכנה")
                ? "⚠️"
                : f.includes("בעלים") || f.includes("מושע")
                  ? "📊"
                  : "🔍";
          html += `<div class="insight-card"><span class="insight-emoji">${emoji}</span><span>${f}</span></div>`;
        });
        html += `</div>`;

        // ── Coverage ratio histogram ──
        html += `<div class="stats-section"><h3>כיסוי בניינים לפי חלקה (%)</h3>`;
        html += buildCoverageHistogram();
        html += `</div>`;

        // ── Documents per address (horizontal bar) ──
        html += `<div class="stats-section"><h3>מסמכים לפי כתובת (Top 15)</h3>`;
        html += buildDocsPerAddressChart();
        html += `</div>`;

        // ── Demolition by year (with 90s highlight) ──
        html += `<div class="stats-section"><h3>צווי הריסה לפי שנה</h3>`;
        const demoYears = Object.entries(a.demolition_by_year)
          .map(([y, c]) => [parseInt(y), c])
          .filter(([y]) => y >= 1960 && y <= 2025);
        const maxDemo = Math.max(...demoYears.map(([, c]) => c), 1);
        html += `<div class="bar-chart">`;
        demoYears.forEach(([year, count]) => {
          const pct = (count / maxDemo) * 100;
          const isNineties = year >= 1990 && year <= 1999;
          const color = isNineties ? "red" : "blue";
          html += `
            <div class="bar-row">
              <span class="bar-label">${year}</span>
              <div class="bar-track">
                <div class="bar-fill ${color}" style="width:${pct}%"></div>
              </div>
              <span class="bar-value">${count}</span>
            </div>`;
        });
        html += `</div>`;
        html += `<div class="note">שנות ה-90 מודגשות באדום — שיא צווי הריסה מתלכד עם תב"ע 2215</div></div>`;

        // ── Permit vs completion gap (dual bars per street) ──
        html += `<div class="stats-section"><h3>היתרים מול תעודות גמר</h3>`;
        const pvEntries = Object.entries(a.permits_vs_completions);
        const maxPV = Math.max(
          ...pvEntries.map(([, v]) => Math.max(v.permits, v.completions)),
          1,
        );
        pvEntries.forEach(([decade, v]) => {
          const pPct = (v.permits / maxPV) * 100;
          const cPct = (v.completions / maxPV) * 100;
          html += `
            <div class="dual-bar-row">
              <span class="dual-bar-label">${decade}</span>
              <div class="dual-bar-container">
                <div class="dual-bar-track">
                  <div class="bar-fill blue" style="width:${pPct}%"></div>
                </div>
                <div class="dual-bar-track">
                  <div class="bar-fill green" style="width:${cPct}%"></div>
                </div>
              </div>
              <div class="dual-bar-vals">
                <span style="color:#60a5fa">${v.permits}</span>
                <span style="color:#4ade80">${v.completions}</span>
              </div>
            </div>`;
        });
        html += `<div class="note" style="margin-top:6px">
          <span style="color:#60a5fa">■</span> היתרים
          &nbsp;<span style="color:#4ade80">■</span> תעודות גמר
          &nbsp;— פער = בנייה שלא הושלמה רשמית
        </div></div>`;

        // ── Parcel decade heatmap ──
        html += `<div class="stats-section"><h3>פעילות לפי חלקה ועשור</h3>`;
        const heatData = a.parcel_decade_heatmap;
        const allDecades = [
          ...new Set(Object.values(heatData).flatMap((d) => Object.keys(d))),
        ].sort();
        const parcels = Object.keys(heatData).sort();

        html += `<div class="heatmap-grid" style="grid-template-columns: 70px repeat(${allDecades.length}, 1fr)">`;
        html += `<div class="heatmap-header">חלקה</div>`;
        allDecades.forEach(
          (d) => (html += `<div class="heatmap-header">${d}</div>`),
        );

        const allVals = Object.values(heatData).flatMap((d) =>
          Object.values(d),
        );
        const maxHeat = Math.max(...allVals, 1);
        parcels.forEach((p) => {
          const label = p.replace("6135_", "");
          html += `<div class="heatmap-cell" style="background:#2d2d4a;font-weight:600">${label}</div>`;
          allDecades.forEach((d) => {
            const val = heatData[p]?.[d] || 0;
            const intensity = val / maxHeat;
            const bg =
              val === 0
                ? "#1a1a2e"
                : `rgba(59,130,246,${0.15 + intensity * 0.7})`;
            html += `<div class="heatmap-cell" style="background:${bg}">${val || ""}</div>`;
          });
        });
        html += `</div></div>`;

        // ── Danger hotspots ──
        html += `<div class="stats-section"><h3>כתובות עם מבנים מסוכנים</h3>`;
        const hotspots = a.danger_hotspots.slice(0, 20);
        html += `<table class="data-table">
          <tr><th>כתובת</th><th>מסמכים</th><th>טווח</th></tr>
          ${hotspots
            .map(
              (h) =>
                `<tr><td>${h.address}</td><td>${h.count}</td><td>${h.date_range}</td></tr>`,
            )
            .join("")}
        </table></div>`;

        // ── Top 5 people by network centrality ──
        html += `<div class="stats-section"><h3>שחקנים מרכזיים ברשת</h3>`;
        html += buildPeopleCentralityChart();
        html += `</div>`;

        // ── Cross parcel owners ──
        html += `<div class="stats-section"><h3>בעלים ביותר מחלקה אחת</h3>`;
        const owners = a.cross_parcel_owners.slice(0, 20);
        html += `<table class="data-table">
          <tr><th>שם</th><th>חלקות</th><th>מסמכים</th></tr>
          ${owners
            .map(
              (o) =>
                `<tr><td>${o.name}</td><td>${o.parcels.map((p) => p.replace("6135_", "")).join(", ")}</td><td>${o.doc_count}</td></tr>`,
            )
            .join("")}
        </table></div>`;

        container.innerHTML = html;
      }

      /* ── New stats chart builders ── */

      function buildCoverageHistogram() {
        // Buildings per parcel, as coverage % of parcel area
        const parcelBuildings = {};
        DATA.buildings.forEach((b) => {
          if (!b.parcel) return;
          if (!parcelBuildings[b.parcel]) parcelBuildings[b.parcel] = 0;
          parcelBuildings[b.parcel]++;
        });

        const buckets = {
          "0-20%": 0,
          "20-40%": 0,
          "40-60%": 0,
          "60-80%": 0,
          "80-100%": 0,
        };
        DATA.parcels.forEach((p) => {
          const buildingCount = parcelBuildings[p.chelka] || 0;
          // Estimate coverage: buildings / max_buildings_per_parcel * 100
          const maxBuildings = Math.max(...Object.values(parcelBuildings), 1);
          const pct = (buildingCount / maxBuildings) * 100;
          if (pct <= 20) buckets["0-20%"]++;
          else if (pct <= 40) buckets["20-40%"]++;
          else if (pct <= 60) buckets["40-60%"]++;
          else if (pct <= 80) buckets["60-80%"]++;
          else buckets["80-100%"]++;
        });

        const maxBucket = Math.max(...Object.values(buckets), 1);
        let html = `<div class="bar-chart">`;
        const colors = ["blue", "blue", "yellow", "orange", "red"];
        Object.entries(buckets).forEach(([label, count], i) => {
          const pct = (count / maxBucket) * 100;
          html += `
            <div class="bar-row">
              <span class="bar-label" style="min-width:50px">${label}</span>
              <div class="bar-track">
                <div class="bar-fill ${colors[i]}" style="width:${pct}%"></div>
              </div>
              <span class="bar-value">${count} חלקות</span>
            </div>`;
        });
        html += `</div>`;
        html += `<div class="note">מספר חלקות לפי יחס כיסוי בנוי</div>`;
        return html;
      }

      function buildDocsPerAddressChart() {
        // Aggregate docs per address from folders
        const addrDocs = {};
        DATA.folders.forEach((f) => {
          const addr = f.primary_address || "לא ידוע";
          addrDocs[addr] = (addrDocs[addr] || 0) + f.doc_count;
        });

        const sorted = Object.entries(addrDocs)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 15);

        const maxDocs = sorted.length > 0 ? sorted[0][1] : 1;
        let html = `<div class="bar-chart">`;
        sorted.forEach(([addr, count]) => {
          const pct = (count / maxDocs) * 100;
          html += `
            <div class="bar-row">
              <span class="bar-label" style="min-width:80px;font-size:10px">${addr}</span>
              <div class="bar-track">
                <div class="bar-fill blue" style="width:${pct}%"></div>
              </div>
              <span class="bar-value">${count}</span>
            </div>`;
        });
        html += `</div>`;
        return html;
      }

      function buildPeopleCentralityChart() {
        if (!PEOPLE_NETWORK || !PEOPLE_NETWORK.people) return "";

        // Use crossParcelCount * appearances as centrality proxy
        const people = PEOPLE_NETWORK.people
          .filter((p) => !p.isInstitutional)
          .map((p) => ({
            name: p.name,
            centrality: p.crossParcelCount * p.appearances,
            appearances: p.appearances,
            parcels: p.crossParcelCount,
            isArchitect: p.isArchitect,
            isRepeatDanger: p.isRepeatDanger,
          }))
          .sort((a, b) => b.centrality - a.centrality)
          .slice(0, 10);

        if (people.length === 0) return "<p>אין נתונים</p>";

        const maxC = people[0].centrality;
        let html = `<div class="bar-chart">`;
        people.forEach((p) => {
          const pct = (p.centrality / maxC) * 100;
          const color = p.isRepeatDanger
            ? "red"
            : p.isArchitect
              ? "blue"
              : "green";
          const tag = p.isArchitect
            ? " (אדריכל)"
            : p.isRepeatDanger
              ? " (סכנה חוזרת)"
              : "";
          html += `
            <div class="bar-row">
              <span class="bar-label" style="min-width:90px;font-size:10px">${p.name}${tag}</span>
              <div class="bar-track">
                <div class="bar-fill ${color}" style="width:${pct}%"></div>
              </div>
              <span class="bar-value" style="min-width:60px">${p.appearances} הופעות</span>
            </div>`;
        });
        html += `</div>`;
        html += `<div class="note" style="margin-top:4px">
          <span style="color:#3b82f6">■</span> אדריכל
          &nbsp;<span style="color:#ef4444">■</span> סכנה חוזרת
          &nbsp;<span style="color:#22c55e">■</span> אחר
          &nbsp;— מיון לפי: הופעות × חלקות
        </div>`;
        return html;
      }

      /* ══════════════════════════════════════════════════════
         BOOT
         ══════════════════════════════════════════════════════ */
      init();
    </script>
  </body>
</html>
